start_date: "2021-01-01"
end_date: "2026-07-25"

calls_url: "https://data.cityofnewyork.us/resource/erm2-nwe9.json"
events_url: "https://data.cityofnewyork.us/resource/bkfu-528j.json"
event_include_types:
  - "Parade"
  - "Street Festival"
  - "Single Block Festival"
  - "Block Party"
  - "Farmers Market"
  - "Street Event"
  - "Religious Event"
  - "Plaza Event"
  - "Plaza Partner Event"
  - "Athletic Race / Tour"
  - "Open Street Partner Event"
  - "Health Fair"
  - "Sidewalk Sale"

weather_lat: 40.7812
weather_lon: -73.9665
weather_daily_vars: "temperature_2m_max,temperature_2m_min,rain_sum,snowfall_sum"
weather_archive_url: "https://archive-api.open-meteo.com/v1/archive"
weather_forecast_url: "https://historical-forecast-api.open-meteo.com/v1/forecast"

model_params:
  n_estimators: 200
  max_depth: 4
  learning_rate: 0.05
  random_state: 42
  enable_categorical: true

test_size: 0.2
val_size: 0.2
random_state: 42
ranking_k: 5

target_col: "tgt_calls"
split_col: "split"
stratify_col: "week_start"

max_lag_weeks: 6
year_offset_weeks: 52  # for the "_ly" (last-year) lags — separates recent trend from same-time-last-year

raw_dir: "data/dev/00_raw"
report_dir: "data/dev/02_reporting"
mlflow_tracking_uri: "sqlite:///data/dev/02_reporting/mlflow.db"
mlflow_experiment: "311-modeling"
mlflow_model_name: "311-modeling"

raw_fetch_retries: 3
raw_fetch_backoff_seconds: 5.0

lookback_weeks: 3
top_k: 5
top_reasons: 3
mlflow_tweet_experiment: "311-tweet"
mlflow_tweet_daily_experiment: "311-tweet-daily"

districts_url: "https://data.cityofnewyork.us/resource/5crt-au7u.geojson"
boro_names:
  "1": "MANHATTAN"
  "2": "BRONX"
  "3": "BROOKLYN"
  "4": "QUEENS"
  "5": "STATEN ISLAND"
districts_retries: 3
districts_backoff_seconds: 5.0

map_colors: ["#2563eb", "#f97316"]

weekday_to_rank:
  0: 1
  1: 2
  2: 3
  3: 4
  4: 5

complaint_type_groups:
  noise:
    - "Noise"
    - "Noise - Residential"
    - "Noise - Street/Sidewalk"
    - "Noise - Commercial"
    - "Noise - Vehicle"
    - "Noise - Helicopter"
  parking_vehicles:
    - "Illegal Parking"
    - "Blocked Driveway"
    - "Abandoned Vehicle"
    - "Derelict Vehicles"
  heat_hot_water:
    - "HEAT/HOT WATER"
  housing_conditions:
    - "UNSANITARY CONDITION"
    - "PLUMBING"
    - "PAINT/PLASTER"
    - "DOOR/WINDOW"
    - "WATER LEAK"
    - "FLOORING/STAIRS"
    - "ELECTRIC"
    - "APPLIANCE"
    - "General Construction/Plumbing"
    - "Building/Use"
  streets_traffic:
    - "Street Condition"
    - "Traffic Signal Condition"
    - "Street Light Condition"
    - "Sidewalk Condition"
  sanitation_trash:
    - "Dirty Condition"
    - "Missed Collection"
    - "Illegal Dumping"
    - "Request Large Bulky Item Collection"
  water_sewer:
    - "Water System"
    - "Sewer"
  parks_trees:
    - "Damaged Tree"
    - "Overgrown Tree/Branches"
  homelessness:
    - "Encampment"
    - "Homeless Person Assistance"
  pests_health:
    - "Rodent"
# anything not listed above falls into the residual "other" group — see build_grouped_target

shared_feature_cols:
  - "ft_week_of_year"
  - "ft_event_count"
  - "ft_lag1_temp_max"
  - "ft_lag1_temp_min"
  - "ft_lag1_had_rain"
  - "ft_lag1_had_snow"
  - "ft_pred_temp_max"
  - "ft_pred_temp_min"
  - "ft_pred_had_rain"
  - "ft_pred_had_snow"
  - "ft_board_key"

shared_categorical_features:
  - "ft_board_key"

reason_map:
  ft_lag_1: "recent historical patterns"
  ft_lag_2: "recent historical patterns"
  ft_lag_3: "recent historical patterns"
  ft_lag_4: "recent historical patterns"
  ft_lag_5: "recent historical patterns"
  ft_lag_6: "recent historical patterns"
  ft_lag_1_ly: "patterns from this time last year"
  ft_lag_2_ly: "patterns from this time last year"
  ft_lag_3_ly: "patterns from this time last year"
  ft_lag_4_ly: "patterns from this time last year"
  ft_lag_5_ly: "patterns from this time last year"
  ft_lag_6_ly: "patterns from this time last year"
  ft_week_of_year: "seasonal timing"
  ft_event_count: "scheduled local events"
  ft_lag1_temp_max: "recent warm weather"
  ft_lag1_temp_min: "recent cold weather"
  ft_lag1_had_rain: "recent rain"
  ft_lag1_had_snow: "recent snow"
  ft_pred_temp_max: "warm weather in the forecast"
  ft_pred_temp_min: "cold weather in the forecast"
  ft_pred_had_rain: "rain in the forecast"
  ft_pred_had_snow: "snow in the forecast"
  ft_board_key: "typical activity levels in this district"
