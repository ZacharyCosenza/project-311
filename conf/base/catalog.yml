# Raw layer — API fetch outputs
calls_weekly:
  type: pandas.ParquetDataset
  filepath: data/dev/00_raw/calls_weekly.parquet

events_weekly:
  type: pandas.ParquetDataset
  filepath: data/dev/00_raw/events_weekly.parquet

weather_lag1:
  type: pandas.ParquetDataset
  filepath: data/dev/00_raw/weather_lag1.parquet

weather_pred:
  type: pandas.ParquetDataset
  filepath: data/dev/00_raw/weather_pred.parquet

# Processed layer — target + feature engineering outputs
target:
  type: pandas.ParquetDataset
  filepath: data/dev/01_processed/target.parquet

lag_features:
  type: pandas.ParquetDataset
  filepath: data/dev/01_processed/lag_features.parquet

event_features:
  type: pandas.ParquetDataset
  filepath: data/dev/01_processed/event_features.parquet

weather_features:
  type: pandas.ParquetDataset
  filepath: data/dev/01_processed/weather_features.parquet

features:
  type: pandas.ParquetDataset
  filepath: data/dev/01_processed/features.parquet

# Reporting layer — model artifacts and evaluation
model:
  type: pickle.PickleDataset
  filepath: data/dev/02_reporting/model.pkl

modeling_data:
  type: pandas.ParquetDataset
  filepath: data/dev/02_reporting/modeling_data.parquet

metrics:
  type: pandas.CSVDataset
  filepath: data/dev/02_reporting/metrics.csv

feature_histograms:
  type: matplotlib.MatplotlibWriter
  filepath: data/dev/02_reporting/feature_histograms.png
  save_args:
    format: png
