apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: modeling
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ZacharyCosenza/project-311.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
