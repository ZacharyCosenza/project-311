apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: train
  namespace: argo
spec:
  schedules:
    - "0 7 * * *"           # daily, 7:00 AM America/New_York
  timezone: "America/New_York"
  concurrencyPolicy: Forbid # skip if a run is already in progress
  workflowSpec:
    serviceAccountName: argo
    entrypoint: train
    volumes:
      - name: data
        hostPath:
          path: /app/data
    templates:
      - name: train
        container:
          image: ghcr.io/zacharycosenza/modeling:latest
          imagePullPolicy: Always
          command: ["kedro", "run"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: KEDRO_ENV
              value: "prod"
          volumeMounts:
            - name: data
              mountPath: /app/data
