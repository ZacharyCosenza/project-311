apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: tweet-daily
  namespace: argo
spec:
  schedules:
    - "20 8 * * 1-5"        # Mon-Fri, 8:20 AM America/New_York — reads Monday's inference_results
  timezone: "America/New_York"
  concurrencyPolicy: Forbid # skip if a run is already in progress
  workflowSpec:
    serviceAccountName: argo
    entrypoint: tweet-daily
    volumes:
      - name: data
        hostPath:
          path: /app/data
    templates:
      - name: tweet-daily
        container:
          image: ghcr.io/zacharycosenza/modeling:latest
          imagePullPolicy: Always
          command: ["kedro", "run", "--pipeline", "tweet_daily"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: KEDRO_ENV
              value: "prod"
            - name: HOME
              value: "/tmp"
          envFrom:
            - secretRef:
                name: twitter-credentials
          volumeMounts:
            - name: data
              mountPath: /app/data
