[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modeling"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.3",
    "numpy==2.4.4",
    "pyarrow==24.0.0",
    "requests==2.34.2",
    "requests-cache==1.3.2",
    "scikit-learn==1.9.0",
    "xgboost==3.3.0",
    "mlflow>=2.14",
    "pyspark>=3.5",
]

[project.optional-dependencies]
notebooks = ["jupyter", "plotly", "matplotlib", "umap-learn"]

[tool.setuptools.packages.find]
where = ["src"]
