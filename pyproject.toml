[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modeling"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.4.4",
    "pyarrow==24.0.0",
    "requests==2.34.2",
    "scikit-learn==1.9.0",
    "xgboost==3.3.0",
    "mlflow==3.14.0",
    "pyspark==4.2.0",
    "matplotlib==3.11.0",
    "shap==0.52.0",
    "geopandas==1.1.4",
]

[project.optional-dependencies]
notebooks = ["jupyter", "plotly", "requests-cache", "umap-learn"]

[tool.setuptools.packages.find]
where = ["src"]
