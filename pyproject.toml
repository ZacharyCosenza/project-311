[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modeling"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.4.4",
    "pyarrow==24.0.0",
    "requests==2.34.2",
    "scikit-learn==1.9.0",
    "xgboost==3.3.0",
    "mlflow==3.14.0",
    "pyspark==4.2.0",
    "matplotlib==3.11.0",
    "kedro>=1.5.0",
    "kedro-datasets[pandas,pickle]>=3.0.0",
    "shap>=0.46.0",
]

[project.optional-dependencies]
notebooks = ["jupyter", "plotly", "requests-cache", "umap-learn"]
test = ["pytest", "pytest-timeout"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.kedro]
package_name = "modeling"
project_name = "project-311"
kedro_init_version = "1.5.0"
source_dir = "src"

[tool.kedro_telemetry]
project_id = "9c4f5991015947ac9faa6b6568de4564"
